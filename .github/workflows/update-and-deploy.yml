name: Update data and deploy

on:
  workflow_dispatch:
    inputs:
      yahoo_close_mode:
        description: Yahoo close selection mode
        required: false
        default: normal_daily_close
        type: choice
        options:
          - normal_daily_close
          - early_fixed_close
  schedule:
    # EDT summer schedule: 20:15 America/New_York.
    - cron: '15 0 * * *'
    # EDT summer schedule: 00:15 America/New_York.
    - cron: '15 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Restore previous static data
        uses: actions/cache@v4
        with:
          path: public/data
          key: oil-data-${{ github.run_id }}
          restore-keys: |
            oil-data-

      - name: Resolve Yahoo close mode
        id: close_mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.yahoo_close_mode || 'normal_daily_close' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 0 * * *" ]; then
            echo "mode=early_fixed_close" >> "$GITHUB_OUTPUT"
          else
            echo "mode=normal_daily_close" >> "$GITHUB_OUTPUT"
          fi

      - name: Update static market data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          YAHOO_CLOSE_MODE: ${{ steps.close_mode.outputs.mode }}
        run: python scripts/update_data.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
